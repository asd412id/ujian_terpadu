# =================================================================
# Docker Compose — Ujian Terpadu (Production)
# Laravel Octane + FrankenPHP + Nginx LB + Horizon + Cloudflare Tunnel
# Optimized for 8 core / 32GB RAM / 7000+ concurrent users
#
# Architecture:
#   Internet → Cloudflare Tunnel → Nginx LB → App replicas (×8)
#                                                ↓
#                              MariaDB 11.7 + Redis 7
#                                                ↓
#                              Horizon (queue) + Scheduler (cron)
#
# Memory Budget (32GB):
#   nginx:        256 MB
#   app ×8:     8192 MB (8 × 1024 MB, each 16 workers = 128 total)
#   horizon:    1536 MB  (custom php.ini: OPcache 64M, JIT 32M)
#   scheduler:   256 MB  (custom php.ini: OPcache 32M, JIT off)
#   mariadb:    4096 MB  (innodb_buffer_pool_size 2.5G for 7K users)
#   redis:      1536 MB  (maxmemory 1024mb)
#   tunnel ×2:   512 MB  (2 × 256 MB, GOMEMLIMIT=180MiB each)
#   ─────────────
#   Total: ~16384 MB (leaves ~16GB for OS + Docker overhead)
#
# CPU Budget (8 vCPU):
#   Reservations (guaranteed):             Limits (burst max):
#   nginx:       0.15                      nginx:       0.50
#   app ×8:      0.50 × 8 = 4.00           app ×8:      1.00 × 8 = 8.00
#   horizon:     0.50                      horizon:     1.50
#   scheduler:   0.10                      scheduler:   0.25
#   mariadb:     1.00                      mariadb:     2.50
#   redis:       0.30                      redis:       0.75
#   tunnel ×2:   0.05 × 2 = 0.10           tunnel ×2:   0.15 × 2 = 0.30
#   ─────────────                          ─────────────
#   Total: 6.15 (leaves 1.85 for OS)       Total: 13.80 (mild overcommit, OK)
#
# No ports exposed — all traffic goes through Cloudflare Tunnel.
# =================================================================

services:
  # --- Nginx Load Balancer ---
  nginx:
    image: nginx:1.27-alpine
    container_name: ujian_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/nginx-status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.15"
          memory: 128M

  # --- App (FrankenPHP + Octane) — scaled to 8 replicas ---
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVER_NAME=:8000
      - OCTANE_WORKERS=${OCTANE_WORKERS:-16}
      - RUN_MIGRATIONS=false
    volumes:
      - .env:/app/.env
      - app_storage:/app/storage
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./docker/app/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    depends_on:
      app-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    deploy:
      replicas: ${APP_REPLICAS:-8}
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 512M

  # --- App Migrator (one-shot: runs migrations then exits) ---
  app-migrator:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: "no"
    env_file: .env
    environment:
      - SERVER_NAME=:8000
      - RUN_MIGRATIONS=true
    entrypoint: ["entrypoint.sh"]
    command: ["echo", "Migrations complete, exiting."]
    volumes:
      - .env:/app/.env
      - app_storage:/app/storage
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    # --- Horizon (Queue Worker) ---
  # Memory: 1024MB for horizon master + supervisors + worker processes
  # Custom php.ini: OPcache 64M + JIT 32M (reduced from app's 128M + 64M)
  horizon:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: ujian_horizon
    restart: unless-stopped
    env_file: .env
    environment:
      - RUN_MIGRATIONS=false
    entrypoint: ["entrypoint.sh"]
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    volumes:
      - .env:/app/.env
      - app_storage:/app/storage
      - ./docker/horizon/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./docker/horizon/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    depends_on:
      app-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/*/cmdline 2>/dev/null | tr '\\0' ' ' | grep -q 'artisan horizon' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.50"
          memory: 512M

  # --- Scheduler (Cron) ---
  # Custom php.ini: OPcache 32M, JIT disabled (saves ~96MB vs app config)
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: ujian_scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      - RUN_MIGRATIONS=false
    entrypoint: ["entrypoint.sh"]
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    volumes:
      - .env:/app/.env
      - app_storage:/app/storage
      - ./docker/scheduler/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./docker/scheduler/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    depends_on:
      app-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/*/cmdline 2>/dev/null | tr '\\0' ' ' | grep -q 'schedule:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

  # --- Cloudflare Tunnel (×2 replicas) ---
  # Go runtime uses ~1.3GB virtual memory but only ~70MB RSS.
  # OOM was triggered by cgroup limit — raised to 256M with GOMEMLIMIT
  # to let Go GC be aware of the constraint and collect aggressively.
  # 2 replicas for HA: if one restarts, the other keeps serving traffic.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - GOMAXPROCS=1
      - GOMEMLIMIT=180MiB
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.15"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # --- MariaDB 11.7 ---
  mariadb:
    image: mariadb:11.7
    container_name: ujian_mariadb
    init: true
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
      MARIADB_DATABASE: ${DB_DATABASE:-ujian_terpadu}
      MARIADB_USER: ${DB_USERNAME:-ujian_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.50"
          memory: 4096M
        reservations:
          cpus: "1.00"
          memory: 2048M

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: ujian_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 1024mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --io-threads 4
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1536M
        reservations:
          cpus: "0.30"
          memory: 512M

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

networks:
  frontend:
    driver: bridge
    internal: false
  backend:
    driver: bridge
    internal: true
