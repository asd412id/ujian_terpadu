# =================================================================
# Nginx Reverse Proxy + Load Balancer — Ujian Terpadu
# Distributes traffic across FrankenPHP app replicas (HTTP mode)
# Uses variable-based proxy_pass for Docker DNS round-robin
# =================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Real IP Detection ---
# Behind Docker network + Cloudflare Tunnel, the default $remote_addr is the
# Docker bridge IP (172.x.x.x), not the real client. We must extract the
# real client IP from X-Forwarded-For / CF-Connecting-IP headers.

# Trust Docker internal networks
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;

# Trust Cloudflare IPv4 ranges (https://www.cloudflare.com/ips-v4/)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;

# Trust Cloudflare IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use CF-Connecting-IP when behind Cloudflare Tunnel, fallback to X-Forwarded-For
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    # Docker DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend variable — Nginx re-resolves on each request via Docker DNS
    set $backend "http://app:8000";

    # --- Security headers (server level) ---
    include /etc/nginx/security-headers.conf;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/vnd.ms-fontobject application/x-font-ttf
        image/svg+xml font/opentype font/woff font/woff2;

    # --- Client body ---
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # --- Timeouts ---
    keepalive_timeout 65;
    send_timeout 60;

    # --- Login endpoints ---
    location ~ ^/(login|ujian/login)$ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
    }

    # --- API endpoints ---
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;

        # Shorter timeouts for API
        proxy_connect_timeout 5;
        proxy_send_timeout 30;
        proxy_read_timeout 30;
    }

    # --- Service Worker ---
    location = /sw.js {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # --- PWA Manifest ---
    location = /manifest.json {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # --- Static assets (aggressive cache) ---
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|gif|ico|woff|woff2|ttf|otf|eot)$ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Health check (for Cloudflare Tunnel & Docker healthcheck) ---
    location = /up {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Nginx status (internal monitoring) ---
    location = /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # --- All other requests → proxy to app cluster ---
    location / {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        include /etc/nginx/security-headers.conf;

        # Timeouts
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
        proxy_read_timeout 300;

        # Buffering
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- Deny hidden files ---
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
