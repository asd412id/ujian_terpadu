# Security headers — included in every location block.
# Nginx add_header is NOT inherited into child location blocks, so this
# snippet must be included explicitly wherever add_header is used.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; img-src 'self' data: blob:; font-src 'self' data: https://fonts.bunny.net https://cdn.jsdelivr.net; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self';" always;
